<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITENS DE ESTOQUE - CAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="R.png" alt="Logo CAT" class="header-logo">
        </div>
    </header>

    <div class="search-container">
        <input type="text" class="search-input" placeholder="Digite para pesquisar...">
        <button class="search-btn" onclick="toggleSearch()">
            <i class="fas fa-search"></i>
        </button>
    </div>

    <main class="main-content">
        <p id="resultCount"></p>
        <div class="items-container" id="itemsContainer"></div>
    </main>

    <!-- items.js define o array ITEMS. E gerado por converte.py, nao precisa ser escrito a mao. -->
    <script src="items.js"></script>
    <script src="Script.js"></script>
